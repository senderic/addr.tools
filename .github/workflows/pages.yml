name: Deploy dnscheck to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'website/dnscheck.tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r website/dnscheck.tools/. _site/
          # refresh the generated ISP-range data (non-fatal if upstream is unreachable)
          curl -fsSL 'https://dnscheck.tools/known-ipranges.json' -o _site/known-ipranges.json || true
          printf 'dnscheck.ericsender.com\n' > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
